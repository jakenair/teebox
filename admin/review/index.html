<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authenticity reviews · TeeBox</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.firebasestorage.app https://firebasestorage.googleapis.com; connect-src 'self' https://*.googleapis.com https://*.firebaseapp.com https://us-central1-teebox-market.cloudfunctions.net https://*.run.app; frame-src https://teebox-market.firebaseapp.com https://apis.google.com; object-src 'none'; base-uri 'self'">
<style>
  :root { --green-900: #0b1a0e; --green-700: #1f4827; --gold-500: #c5a253; --cream: #faf8f3; --ink: #1d2420; --muted: #5d665f; --line: #e3e0d6; --bad: #a3321f; --bad-bg: #fbecea; --ok: #2d6a3a; --ok-bg: #e9f3eb; --warn: #7a5712; --warn-bg: #fdf4e1; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 16px; line-height: 1.5; }
  header { background: var(--green-900); padding: 18px 16px; }
  header .in, main { max-width: 860px; margin: 0 auto; }
  header .in { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  header .logo { font-family: Georgia, "Times New Roman", serif; font-size: 1.6rem; font-weight: 900; color: #fff; text-decoration: none; letter-spacing: -0.5px; }
  header .logo span { color: var(--gold-500); }
  header .back { color: rgba(255,255,255,.85); font-size: .9rem; font-weight: 600; text-decoration: none; }
  main { padding: 28px 16px 64px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 1.9rem; margin: 0 0 6px; letter-spacing: -0.5px; }
  .lede { color: var(--muted); margin: 0 0 20px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .card h2 { font-size: 1.1rem; margin: 0; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: .9rem; margin: 4px 0; overflow-wrap: anywhere; }
  .state { display: inline-block; font-size: .8rem; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); }
  .state.rejected { background: var(--bad-bg); color: var(--bad); }
  .photos { display: flex; gap: 8px; overflow-x: auto; margin: 12px 0; }
  .photos img { width: 132px; height: 132px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); display: block; }
  label { display: block; font-size: .9rem; font-weight: 600; margin: 10px 0 4px; }
  textarea { width: 100%; min-height: 72px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; font: inherit; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  button, .btn { min-height: 44px; padding: 0 20px; border-radius: 50px; border: 1px solid var(--green-700); background: var(--green-700); color: #fff; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  .ghost { background: #fff; color: var(--green-700); }
  .danger { background: #fff; color: var(--bad); border-color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 3px solid var(--gold-500); outline-offset: 2px; }
  .note { padding: 12px 14px; border-radius: 10px; margin: 0 0 16px; background: var(--ok-bg); color: var(--ok); }
  .note.bad { background: var(--bad-bg); color: var(--bad); }
  .note:empty { display: none; }
</style>
</head>
<body>
<header><div class="in"><a class="logo" href="/">Tee<span>Box</span></a><a class="back" href="/">Back to TeeBox</a></div></header>
<main>
  <h1>Authenticity reviews</h1>
  <p class="lede">Listings at $300 and up stay out of our ads until you approve them. The seller gets an email either way.</p>
  <p class="note" id="note" role="status" aria-live="polite"></p>
  <div id="list"></div>
</main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged, GoogleAuthProvider, OAuthProvider, EmailAuthProvider, signInWithPopup, reauthenticateWithPopup, reauthenticateWithCredential } from 'https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js';
import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/12.12.0/firebase-functions.js';
const app = initializeApp({
    apiKey: "AIzaSyAQ7vikZutCQfAaXybQnJcfgnlqpXxHTr4",
    authDomain: "teebox-market.firebaseapp.com",
    projectId: "teebox-market",
    storageBucket: "teebox-market.firebasestorage.app",
    messagingSenderId: "982122063122",
    appId: "1:982122063122:web:416617dcacf912c907bfcb"
  });
const auth = getAuth(app), fns = getFunctions(app, 'us-central1');
const $ = (id) => document.getElementById(id);
const el = (tag, props, ...kids) => { const n = Object.assign(document.createElement(tag), props || {}); kids.forEach((k) => k && n.append(k)); return n; };
const note = (text, bad) => { $('note').textContent = text || ''; $('note').className = bad ? 'note bad' : 'note'; };
const call = async (name, data) => (await httpsCallable(fns, name)(data || {})).data;
async function reauth() {
  const u = auth.currentUser, ids = u.providerData.map((p) => p.providerId);
  if (ids.includes('google.com')) await reauthenticateWithPopup(u, new GoogleAuthProvider());
  else if (ids.includes('apple.com')) await reauthenticateWithPopup(u, new OAuthProvider('apple.com'));
  else {
    const pw = window.prompt('Confirm your password to continue');
    if (!pw) throw new Error('Cancelled.');
    await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, pw));
  }
  await u.getIdToken(true);
}
async function callFresh(name, data) {
  try { return await call(name, data); } catch (e) {
    if (e && e.details && e.details.reauthRequired) { await reauth(); return call(name, data); }
    throw e;
  }
}
const safe = (u) => { try { const p = new URL(u); return p.protocol === 'https:' ? p.href : ''; } catch (_e) { return ''; } };
function card(it) {
  const rejected = it.state === 'rejected';
  const reason = el('textarea', { id: 'r-' + it.listingId, maxLength: 500 });
  const approve = el('button', { type: 'button', textContent: 'Approve' });
  const reject = el('button', { type: 'button', className: 'danger', textContent: 'Reject' });
  const photos = el('div', { className: 'photos' });
  (it.photos || []).map(safe).filter(Boolean).forEach((u, i) => photos.append(
    el('a', { href: u, target: '_blank', rel: 'noopener' }, el('img', { src: u, alt: 'Photo ' + (i + 1), loading: 'lazy' }))));
  const decide = async (decision) => {
    const why = reason.value.trim();
    if (decision === 'reject' && !why) { note('Add a reason before rejecting.', true); reason.focus(); return; }
    if (!window.confirm(decision === 'approve'
      ? 'Approve "' + it.title + '"? The seller gets an email and it can be advertised.'
      : 'Reject "' + it.title + '"? It comes off the site and the seller gets an email.')) return;
    approve.disabled = reject.disabled = true;
    try {
      const r = await callFresh('decideAuthReview', { listingId: it.listingId, decision, reason: why });
      await load();
      note((decision === 'approve' ? 'Approved: ' : 'Rejected and taken down: ') + it.title +
        (r.noop ? ' (already decided).' : r.emailed ? '. Seller emailed.' : '. The seller email did not send.'), !r.noop && !r.emailed);
    } catch (e) { note(e.message || 'Something went wrong.', true); approve.disabled = reject.disabled = false; }
  };
  approve.onclick = () => decide('approve');
  reject.onclick = () => decide('reject');
  return el('section', { className: 'card' },
    el('h2', { textContent: it.title + ' · $' + it.ask }),
    el('p', { className: 'meta', textContent: [it.brand, it.condition].filter(Boolean).join(' · ') }),
    el('p', { className: 'meta', textContent: 'Seller: ' + (it.sellerName || 'no name on file') + ' · ' + it.sellerId }),
    el('span', { className: 'state' + (rejected ? ' rejected' : ''), textContent: it.state + ' · listing is ' + it.status }),
    it.reason ? el('p', { className: 'meta', textContent: it.reason }) : null,
    photos,
    rejected ? null : el('label', { htmlFor: reason.id, textContent: 'Reason, if you reject (the seller sees this)' }),
    rejected ? null : reason,
    el('div', { className: 'row' }, approve, rejected ? null : reject,
      el('a', { className: 'btn ghost', href: '/?listing=' + encodeURIComponent(it.listingId), target: '_blank', rel: 'noopener', textContent: 'Open listing' })));
}
async function load() {
  const { items } = await call('listAuthReviews');
  $('list').replaceChildren(...(items.length ? items.map(card) : [el('p', { className: 'lede', textContent: 'No reviews waiting.' })]));
}
onAuthStateChanged(auth, async (u) => {
  $('list').replaceChildren();
  if (!u) {
    const b = el('button', { type: 'button', textContent: 'Sign in with Google' });
    b.onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch((e) => note(e.message, true));
    note('Sign in with the admin account.');
    $('list').append(b);
    return;
  }
  try {
    let t = await u.getIdTokenResult();
    if (!t.claims.admin) t = await u.getIdTokenResult(true);
    if (t.claims.admin !== true) { note('This account is not an admin.', true); return; }
    note('Loading reviews.');
    await load();
    note('');
  } catch (e) { note(e.message || 'Could not load reviews.', true); }
});
</script>
</body>
</html>
